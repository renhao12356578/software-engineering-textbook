name: Auto Add Contributors

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  add-contributor:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add contributor
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "PR 作者：$AUTHOR  PR 号：#${{ github.event.pull_request.number }}"

          npx all-contributors-cli add "$AUTHOR" code

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .all-contributorsrc README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "docs: add @${{ github.event.pull_request.user.login }} as a contributor"
          git push origin main